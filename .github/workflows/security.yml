# Security scanning workflow
# Runs npm audit (dependency vulnerabilities), Trivy (filesystem/secret scan),
# and Hadolint (Dockerfile linting). Findings are reported in the job logs.

name: Security

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    # Run weekly on Monday at 10:00 UTC (after dependabot at 09:00 Europe/Berlin)
    - cron: '0 10 * * 1'
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # npm audit - Dependency vulnerability scanning
  # Fails on high/critical advisories in shipped dependencies
  # ============================================================================
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

  # ============================================================================
  # Trivy - Filesystem and secret scanner
  # Scans the repo for vulnerable dependencies and committed secrets
  # Reference: https://github.com/aquasecurity/trivy-action
  # ============================================================================
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  # ============================================================================
  # Hadolint - Dockerfile linting
  # Checks the Dockerfile for best practices and potential issues
  # Reference: https://github.com/hadolint/hadolint
  # ============================================================================
  hadolint:
    name: Hadolint Dockerfile Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: docker/Dockerfile
          # Treat warnings as errors for stricter linting
          failure-threshold: warning
