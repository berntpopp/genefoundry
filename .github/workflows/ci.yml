name: CI
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    name: Static site, interactions and HTTP delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run type-check
      - run: npm run lint:check
      - run: npm run format:check
      - run: npm test
      - run: node scripts/check-docker-context.mjs
      - name: Build prior revision in an isolated checkout
        run: node scripts/build-baseline.mjs
      - run: npm run build:matrix
      - run: npm run test:e2e:all
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-verification
          path: |
            .build/playwright-report/
            .build/test-results/
            .build/artifacts/root/
            .build/artifacts/mirror/
            .build/artifacts/*.record.json
          include-hidden-files: true
          retention-days: 7
