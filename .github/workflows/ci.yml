name: CI
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    name: Static site, interactions and HTTP delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run type-check
      - run: npm run lint:check
      - run: npm run format:check
      - run: npm test
      - run: node scripts/check-docker-context.mjs
      - name: Build prior revision in an isolated checkout
        run: node scripts/build-baseline.mjs
      - run: npm run build:matrix
      - run: npm run test:e2e:all
      - run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: always()

        with:
          name: site-verification
          path: |
            .build/playwright-report/
            .build/test-results/
            .build/artifacts/root/
            .build/artifacts/mirror/
            .build/artifacts/*.record.json
          include-hidden-files: true
          retention-days: 7

  health-container:
    name: Health Container
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run health container smoke test
        run: make test-health-container
