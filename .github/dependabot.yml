# Dependabot configuration for automated dependency updates
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # NPM dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    ignore:
      # lucide-vue-next 1.x is a deprecation tombstone that redirects to
      # @lucide/vue, which dropped the brand icons (e.g. Github) used here.
      # Stay on the maintained 0.x line until those icons are migrated.
      - dependency-name: 'lucide-vue-next'
        update-types: ['version-update:semver-major']
    # Group updates to reduce PR noise
    groups:
      # Group all production dependencies
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      # Group all dev dependencies
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps(dev)'
    labels:
      - 'dependencies'
    reviewers:
      - 'berntpopp'

  # GitHub Actions dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'ci'
    labels:
      - 'dependencies'
      - 'github-actions'

  # Docker base images
  - package-ecosystem: 'docker'
    directory: '/docker'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'docker'
    labels:
      - 'dependencies'
      - 'docker'
    reviewers:
      - 'berntpopp'
