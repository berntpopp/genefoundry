# docker-compose.npm.yml
# GeneFoundry Landing Page - Nginx Proxy Manager (NPM) Production Overlay
#
# Usage (production; pulls the pinned image, never builds):
#   GENEFOUNDRY_IMAGE=ghcr.io/berntpopp/genefoundry@sha256:<digest> \
#     docker compose -f docker/docker-compose.yml -f docker/docker-compose.npm.yml up -d
#
# This overlay:
# - Deploys a prebuilt, digest-addressable image (never builds on the host)
# - Removes direct port exposure (NPM handles routing)
# - Connects to external NPM network
# - Adds production security hardening
#
# NPM Configuration:
# - Create proxy host for genefoundry.org → genefoundry-npm:8080
# - Enable SSL with Let's Encrypt
#
# Required environment:
#   GENEFOUNDRY_IMAGE=ghcr.io/berntpopp/genefoundry@sha256:<digest>

name: genefoundry-npm

services:
  genefoundry:
    container_name: genefoundry-npm

    # PRODUCTION: pull the released image, never build on the deployment host.
    # `!reset null` is required: the base compose file defines `build:`, and a
    # plain override would merge rather than remove it, leaving compose free to
    # build from local (possibly stale) source instead of using the pinned image.
    build: !reset null
    image: ${GENEFOUNDRY_IMAGE:?Set GENEFOUNDRY_IMAGE to ghcr.io/berntpopp/genefoundry@sha256:<digest>}
    pull_policy: missing

    # PRODUCTION: No direct ports - NPM handles all routing.
    # `!reset []` is required: compose MERGES list fields across `-f` overlays, so
    # a plain `ports: []` does NOT drop the base file's "${GENEFOUNDRY_PORT:-8080}:8080"
    # mapping - it stayed published on the host, bypassing NPM entirely.
    ports: !reset []

    # SECURITY: Run as non-root (nginx:nginx = 101:101)
    user: '101:101'

    # SECURITY: Security options
    security_opt:
      - no-new-privileges:true

    # SECURITY: Drop all capabilities (nginx doesn't need any)
    cap_drop:
      - ALL

    # SECURITY: Read-only root filesystem
    read_only: true

    # Writable tmpfs mounts for nginx runtime directories
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777,size=10M
      - /var/cache/nginx:uid=101,gid=101,mode=0755,size=50M
      - /var/run:uid=101,gid=101,mode=0755,size=10M

    # Production logging configuration
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'
        labels: 'service=genefoundry,environment=production,proxy=npm'

    networks:
      - npm_proxy_network

networks:
  npm_proxy_network:
    external: true
    name: ${NPM_SHARED_NETWORK_NAME:-npm_default}
