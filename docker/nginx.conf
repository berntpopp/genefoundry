# Static public documents only. Hosted MCP/OAuth routes belong to the edge proxy.
map $uri $site_cache_control {
    default "no-cache";
    "~^/assets/.*-[A-Za-z0-9_-]{8,}\.(css|js|woff2|png|svg)$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Keep all headers at server scope so location-specific caching cannot lose them.
    add_header Cache-Control $site_cache_control always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    brotli_static on;
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml application/manifest+json;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
