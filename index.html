            "@type": "Answer",
            "text": "Add the Streamable-HTTP endpoint to any MCP host. In Claude Code run: claude mcp add --transport http genefoundry https://genefoundry.org/mcp. Cursor, Gemini CLI and VS Code use the same URL in their MCP config. No install, no per-server setup and no API keys."
          }
        },
        {
          "@type": "Question",
          "name": "How does tool discovery work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Instead of loading all 218 tool schemas up front, the agent calls search_tools to rank the federated catalog by relevance, pulls only the schemas it needs, then runs the chosen tool with call_tool by its namespaced name, for example spliceai_predict_variant."
          }
        },
        {
          "@type": "Question",
          "name": "Is GeneFoundry free and open source?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The genefoundry-router is open source under the MIT license. You can self-host it or use the free hosted endpoint at https://genefoundry.org/mcp."
          }
        },
        {
          "@type": "Question",
          "name": "Can GeneFoundry be used for clinical decisions?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. GeneFoundry is for research use only. It is not clinical decision support and must not be used for diagnosis, treatment or patient management."
          }
        }
      ]
    }

      <h1 style="color:#fff;font-size:2rem;line-height:1.2">Every biomedical MCP, behind one endpoint</h1>
      <p>GeneFoundry is a FastMCP gateway that federates 17 biomedical MCP servers (218 tools) behind a single HTTP endpoint, so any Model Context Protocol host taps gnomAD, ClinGen, GTEx, GeneReviews, Mondo and a dozen more sources through one connection.</p>
      <h2 style="color:#fff">How it works</h2>
      <ol>
        <li>Add one endpoint: <code>claude mcp add --transport http genefoundry https://genefoundry.org/mcp</code></li>
        <li>Discover tools with <code>search_tools</code>, ranked by relevance, so your agent pulls only the schemas it needs.</li>
        <li>Run any result with <code>call_tool</code> by its namespaced name. Results stay grounded in the source.</li>
      </ol>
      <h2 style="color:#fff">Federated sources</h2>
      <p>PubTator3, gnomAD, ClinGen, UniProt, MGI, GeneReviews, Mondo, GenCC, STRING, GTEx Portal, HGNC, PanelApp, AutoPVS1, SpliceAI Lookup, Ensembl VEP, ClinVar and LitVar2.</p>
      <p>
        <a href="https://github.com/berntpopp/genefoundry-router" style="color:#ed6fb0">Source on GitHub</a>
        (open source, MIT licensed). Research use only. Not clinical decision support.
      </p>
    </main>
